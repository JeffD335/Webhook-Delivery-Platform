services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: webhook_platform
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook -d webhook_platform"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - webhook_postgres_data:/var/lib/postgresql/data

  receiver:
    image: python:3.12-alpine
    working_dir: /app
    command: ["python3", "tools/test_receiver.py", "--host", "0.0.0.0", "--port", "9090"]
    ports:
      - "9090:9090"
    volumes:
      - ./tools:/app/tools:ro

  app:
    build:
      context: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/webhook_platform
      DATABASE_USERNAME: webhook
      DATABASE_PASSWORD: webhook
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  webhook_postgres_data:
